name: Test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            dbus-x11 \
            libgbm1 \
            libnss3 \
            libasound2t64 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Test pinned native download integrity
        run: node --test scripts/mailsync-download.test.js

      - name: Install dependencies
        run: npm ci

      - name: Verify installed native release
        run: |
          node -e "const assert = require('node:assert/strict'); const pinned = require('./mailsync-release.json'); const installed = require('./app/mailsync-release.json'); assert.equal(installed.revision, pinned.revision); assert.equal(installed.tag, pinned.tag); assert.equal(installed.sha256, pinned.assets['linux-x64'].sha256);"
          ./app/mailsync --help

      - name: Run lint
        run: npm run lint:check

      - name: Run Typecheck
        run: npm run typecheck

      # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor, so
      # Electron cannot use its namespace sandbox and falls back to the SUID helper,
      # which is not setuid root inside node_modules. Re-allow the namespace sandbox
      # rather than passing --no-sandbox, so the tests run the way the app ships.
      - name: Allow Electron's namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        run: dbus-launch --exit-with-session xvfb-run -a npm test
        timeout-minutes: 20
